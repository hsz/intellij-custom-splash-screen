splash.settings.help=Click <b>Apply</b> to use your selection on the next IDE launch. To restore the default splash, turn off <b>Use a custom splash image</b> and click <b>Apply</b>.
splash.settings.requirements=<b>Image guidelines:</b> PNG, JPEG, GIF, or BMP, up to 20 MiB and 16 megapixels. Images are scaled to fit within 720 × 480 logical pixels.
splash.settings.experimental=<b>Compatibility:</b> Experimental support for IntelliJ Platform 2026.2 using its internal splash cache. After an IDE update, cache reset, or display-scale change, the default splash may appear once before your image is reapplied.
